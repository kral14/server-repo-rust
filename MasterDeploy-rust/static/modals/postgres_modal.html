<!-- PostgreSQL Database Manager Modal (Minimalist & Sleek Edition) -->
<div id="postgres-modal" class="modal-backdrop">
    <div class="modal-card" style="max-width: 1020px; width: 96%; max-height: 90vh; overflow-y: auto; padding: 10px 14px;">
        
        <!-- Gizli status konteyneri (JS uyğunluğu üçün arxa planda saxlanılır) -->
        <div id="pg-engine-status-box" style="display: none;">
            <div id="pg-status-dot"></div>
            <div id="pg-status-title"></div>
            <div id="pg-status-sub"></div>
        </div>

        <!-- 1. Ultra-Sleek Action & Toolbar Strip (Hündürlüyü cəmi 30px) -->
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-wrap: wrap;">
            
            <!-- Sol: Server seçimi və Yenilə -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px;">Server:</span>
                <select id="pg-server-select" onchange="onPgServerSelectChange()" 
                        style="height: 32px; padding: 4px 10px; border-radius: 6px; background: rgba(0,0,0,0.5); border: 1px solid var(--card-border); color: #fff; font-size: 0.8rem; line-height: 22px; cursor: pointer; outline: none; min-width: 220px;">
                    <!-- Server options dynamically loaded -->
                </select>

                <button type="button" class="btn btn-secondary" onclick="refreshPgStatus()" 
                        style="height: 32px; width: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px;" title="Yenilə">
                    <i data-lucide="rotate-cw" style="width: 13px; height: 13px;"></i>
                </button>

                <!-- Port 5432 Xaricə Aç / Bağla Nəzarəti -->
                <div id="pg-port-control-wrapper" style="display: none; align-items: center;">
                    <button type="button" id="pg-port-toggle-btn" onclick="togglePgPortAccess()"
                            title="Xarici giriş statusu (DBeaver / Python üçün). Klikləyərək aça və ya bağlaya bilərsiniz"
                            style="height: 32px; padding: 0 10px; font-size: 0.73rem; font-weight: 500; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4);">
                        <span id="pg-port-dot" style="width: 7px; height: 7px; border-radius: 50%; background: #94a3b8;"></span>
                        <span id="pg-port-text">Port 5432: Yoxlanılır</span>
                    </button>
                </div>

                <div id="pg-install-action-wrapper" style="display: none;">
                    <button type="button" class="btn btn-primary" onclick="installPgEngineOnServer()" id="pg-install-btn" 
                            style="height: 32px; padding: 0 10px; font-size: 0.78rem; background: #059669; border: none; display: inline-flex; align-items: center; gap: 4px; border-radius: 6px;">
                        <i data-lucide="download" style="width: 12px; height: 12px;"></i>
                        <span>Quraşdır</span>
                    </button>
                </div>
            </div>

            <!-- Sağ: Kompakt Baza Yaratma Formu (İnline 32px) -->
            <div id="pg-create-section" style="display: none; align-items: center; gap: 6px;">
                <div style="display: flex; align-items: center; background: rgba(0,0,0,0.5); border: 1px solid rgba(59,130,246,0.35); border-radius: 6px; padding: 0 8px; height: 32px;">
                    <i data-lucide="plus-circle" style="width: 13px; height: 13px; color: #60a5fa; margin-right: 6px;"></i>
                    <input type="text" id="pg-new-app-name" placeholder="Layihə adı (məs: floorgame)" 
                           onkeydown="if(event.key==='Enter') generateNewPgDatabase()"
                           style="height: 28px; width: 180px; background: transparent; border: none; color: #fff; font-size: 0.8rem; outline: none;">
                </div>

                <button type="button" class="btn btn-primary" onclick="generateNewPgDatabase()" id="pg-generate-btn" 
                        style="height: 32px; padding: 0 12px; font-weight: 500; font-size: 0.78rem; display: inline-flex; align-items: center; gap: 5px; background: #2563eb; border: none; border-radius: 6px; white-space: nowrap;">
                    <i data-lucide="sparkles" style="width: 12px; height: 12px;"></i>
                    <span>Yarat</span>
                </button>
            </div>
        </div>

        <!-- 2. Son Yaradılan Baza Nəticəsi (Kompakt Alert) -->
        <div id="pg-result-box" style="display: none; margin-bottom: 8px; background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 6px; padding: 5px 10px; animation: fadeIn 0.2s ease;">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 5px; font-size: 0.75rem; color: #34d399; font-weight: 500;">
                    <i data-lucide="check-circle-2" style="width: 12px; height: 12px;"></i>
                    <span id="pg-res-db" style="color: #fff; font-family: monospace;">-</span>
                    <span style="color: var(--text-secondary); font-size: 0.7rem;">(User: <b id="pg-res-user" style="color: #fff;">-</b> | Pass: <b id="pg-res-pass" style="color: #fff; font-family: monospace;">-</b>)</span>
                </div>
                
                <div style="display: flex; align-items: center; gap: 5px; flex: 1; min-width: 250px; justify-content: flex-end;">
                    <input type="text" id="pg-result-conn-str" readonly onclick="this.select()" 
                           style="flex: 1; max-width: 420px; height: 24px; padding: 0 6px; border-radius: 4px; background: #06090e; border: 1px solid rgba(16, 185, 129, 0.4); color: #38bdf8; font-family: monospace; font-size: 0.72rem;">
                    <button type="button" class="btn btn-primary" onclick="copyResultConnStr()" id="pg-copy-result-btn" 
                            style="height: 24px; padding: 0 8px; background: #10b981; border: none; font-size: 0.72rem; font-weight: 500; display: inline-flex; align-items: center; gap: 3px;">
                        <i data-lucide="copy" style="width: 10px; height: 10px;"></i>
                        <span>Kopyala</span>
                    </button>
                    <button type="button" onclick="document.getElementById('pg-result-box').style.display='none'" style="border:none; background:transparent; color:#94a3b8; cursor:pointer; padding: 0 4px; display: inline-flex; align-items: center;">
                        <i data-lucide="x" style="width: 12px; height: 12px;"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 3. Əsas Cədvəl (Ultra-Sleek) -->
        <div style="overflow-x: auto; border: 1px solid var(--card-border); border-radius: 6px; background: rgba(0,0,0,0.15);">
            <table style="width: 100%; border-collapse: collapse; font-size: 0.75rem; text-align: left;">
                <thead>
                    <tr style="background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--card-border); color: #64748b; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.5px;">
                        <th style="padding: 5px 8px; width: 110px;">Layihə</th>
                        <th style="padding: 5px 8px; width: 140px;">Baza / User</th>
                        <th style="padding: 5px 8px; width: 50px;">Port</th>
                        <th style="padding: 5px 8px; min-width: 380px;">Connection String</th>
                        <th style="padding: 5px 8px; width: 60px; text-align: right;">Sil</th>
                    </tr>
                </thead>
                <tbody id="pg-databases-tbody">
                    <tr>
                        <td colspan="5" style="padding: 16px; text-align: center; color: var(--text-secondary); font-size: 0.75rem;">
                            Məlumatlar yüklənir...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Alt məlumat (incə zolaq) -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding: 0 2px; font-size: 0.68rem; color: #64748b;">
            <span id="pg-db-count-badge">0 baza</span>
            <span>🔒 Default olaraq IP və şifrələr gizlidir. Göz və ya detal ilə aça bilərsiniz.</span>
        </div>

    </div>
</div>
