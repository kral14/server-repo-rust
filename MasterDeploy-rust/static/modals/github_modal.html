<div id="github-modal" class="modal-backdrop">
        <div class="modal-card">
            <h2>🐱 GitHub Bağlantısı</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem; line-height: 1.4;">
                DeployMaster-a özəl və ümumi repozitoriyalarınızı gətirmək üçün GitHub Personal Access Token (PAT) daxil
                edin.
            </p>

            <div class="form-group">
                <label>GitHub Personal Access Token (PAT)</label>
                <!-- Fake inputs to prevent password manager popups -->
                <input type="text" style="display:none;" tabindex="-1">
                <input type="password" style="display:none;" tabindex="-1">
                <div style="position: relative; display: flex; align-items: center; width: 100%;">
                    <input type="password" id="gh-token" placeholder="ghp_..." style="font-family: monospace; padding-right: 45px; width: 100%;">
                    <button type="button" onclick="toggleGithubTokenVisibility(event)" style="position: absolute; right: 10px; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.1rem; padding: 4px; z-index: 10; display: flex; align-items: center; justify-content: center; height: 100%;">👁️</button>
                </div>
                <small
                    style="color: var(--text-secondary); display: block; margin-top: 6px; font-size: 0.8rem; line-height: 1.3;">
                    Token yaratmaq üçün <a href="https://github.com/settings/tokens" target="_blank"
                        style="color: var(--accent-color); text-decoration: underline;">GitHub Settings</a> səhifəsinə
                    daxil olun. (Gərəkli icazələr: <code>repo</code>)
                </small>
            </div>

            <div class="form-group"
                style="background: rgba(255,255,255,0.02); padding: 1rem; border-radius: 8px; border: 1px solid var(--card-border); margin-top: 1rem;">
                <span style="font-size: 0.9rem; color: var(--text-secondary);">Bağlantı Statusu:</span>
                <strong id="gh-status" style="margin-left: 0.5rem; color: #94a3b8;">Məlumat yoxdur</strong>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal('github-modal')">Ləğv Et</button>
                <button type="button" class="btn btn-primary" onclick="saveGithubToken()">Yadda Saxla</button>
            </div>
        </div>
    </div>
