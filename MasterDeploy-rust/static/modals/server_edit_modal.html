<div id="server-edit-modal" class="modal-backdrop">
        <div class="modal-card">
            <h2>✏️ Server Ayarlarını Redaktə Et</h2>
            <form id="server-edit-form" novalidate onsubmit="handleUpdateServer(event)">
                <input type="hidden" id="edit-srv-id">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Server Adı</label>
                        <input type="text" id="edit-srv-name" placeholder="Məs: Oracle Always Free">
                    </div>
                    <div class="form-group">
                        <label>IP Ünvanı (Public IP)</label>
                        <input type="text" id="edit-srv-ip" placeholder="Məs: 79.72.95.173">
                    </div>
                    <div class="form-group">
                        <label>SSH İstifadəçi Adı</label>
                        <input type="text" id="edit-srv-user" placeholder="Məs: ubuntu">
                    </div>
                    <div class="form-group">
                        <label>Qlobal SSH Açarını Seçin</label>
                        <select id="edit-srv-key-id" onchange="handleServerKeySelect('edit-srv-key-id', 'edit-srv-key-wrapper')">
                            <!-- SSH keys list loaded dynamically -->
                        </select>
                    </div>
                    <div class="form-group" id="edit-srv-key-wrapper">
                        <label>Mətn olaraq SSH Private Key</label>
                        <textarea id="edit-srv-key" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----..."></textarea>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('server-edit-modal')">Ləğv
                        Et</button>
                    <button type="submit" class="btn btn-primary">Yadda Saxla</button>
                </div>
            </form>
        </div>
    </div>
