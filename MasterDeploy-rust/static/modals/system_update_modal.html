<div id="system-update-modal" class="modal-backdrop">
        <div class="modal-card" style="max-width: 650px; width: 95%; max-height: calc(100vh - 60px);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div>
                    <h2 style="margin: 0; font-size: 1.25rem; color: #fff;">🔄 Sistem Versiyaları</h2>
                    <p style="margin: 4px 0 0; font-size: 0.82rem; color: var(--text-secondary);">Yeni versiyaya keç və ya köhnəyə qayıt</p>
                </div>
            </div>
            <div id="version-cards-list"
                style="max-height: 52vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 6px;">
                <div style="text-align:center; padding: 20px; color: var(--text-secondary);">Yüklənir...</div>
            </div>
            <div class="modal-actions"
                style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--card-border);">
                <button class="btn btn-secondary" onclick="closeModal('system-update-modal')">Bağla</button>
            </div>
        </div>
    </div>
